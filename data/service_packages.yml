# Пакеты услуг юридического бюро для коммерческого предложения.
# Цены подставляются из настроек (вкладка «Настройки»), поле price_key
# указывает, из какой настройки брать цену. Состав работ редактируется здесь.

packages:
  - id: express_docs
    price_key: express_docs
    title: "Экспресс-комплект документов для сайта"
    duration: "от 3 рабочих дней"
    description: "Базовый комплект документов, приводящий публичную часть сайта в порядок."
    items:
      - "Политика обработки персональных данных под фактические формы сайта"
      - "Форма/текст согласия на обработку ПДн"
      - "Согласие на рекламную рассылку (при наличии подписки)"
      - "Раздел/политика cookie и рекомендации по cookie-баннеру"
      - "Рекомендации по размещению ссылок на документы рядом с формами"

  - id: full_audit
    price_key: full_audit
    title: "Полный аудит сайта и документов по 152-ФЗ"
    duration: "от 7 рабочих дней"
    description: "Углублённая проверка публичной части и документов с заключением юриста."
    items:
      - "Ручная проверка всех форм и механики согласий"
      - "Юридический разбор политики, согласий, оферты, cookie policy"
      - "Проверка сторонних сервисов и трансграничной передачи"
      - "Проверка признаков локализации и уведомления РКН"
      - "Письменное заключение с приоритизированным планом исправлений"

  - id: turnkey
    price_key: turnkey
    title: "Сопровождение под ключ"
    duration: "по договорённости"
    description: "Полный цикл приведения в соответствие и дальнейшее сопровождение."
    items:
      - "Разработка полного комплекта локальных актов и документов сайта"
      - "Внедрение корректной механики согласий и cookie-баннера"
      - "Подготовка/актуализация уведомления в Роскомнадзор"
      - "Настройка процессов обработки обращений субъектов ПДн"
      - "Периодический мониторинг и обновление документов"

# Порядок отображения пакетов в отчёте/КП.
order: [express_docs, full_audit, turnkey]
