    should_trigger_cookie_check: false
    should_trigger_cross_border_check: true
    domains: ["cloudflareinsights.com", "static.cloudflareinsights.com", "beacon.min.js"]
    patterns: ["__cfBeacon"]

  - provider_name: "Jivo (JivoSite)"
