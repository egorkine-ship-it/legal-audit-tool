# Каталог сторонних сервисов/трекеров для детектора.
#
# Формат:
# providers:
#   - provider_name: человекочитаемое имя
#     category: analytics | marketing | chat | crm | calltracking | payment | delivery | cdn | other
#     country_hint: RU | foreign | unknown
#     legal_risk: low | medium | high
#     should_be_disclosed_in_policy: true/false
#     should_trigger_cookie_check: true/false
#     should_trigger_cross_border_check: true/false
#     domains: [подстроки для поиска в URL script/iframe/network]
#     patterns: [опциональные подстроки для поиска в HTML/inline-JS: fbq, gtag и т.п.]
#
# Как добавить трекер: добавьте новый элемент в providers. Код менять не нужно.

providers:
  - provider_name: "Яндекс.Метрика"
    category: analytics
    country_hint: RU
    legal_risk: medium
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: false
    domains: ["mc.yandex.ru", "mc.yandex.com", "yandex.ru/metrika", "metrika.yandex"]
    patterns: ["ym(", "yandex_metrika", "Ya.Metrika", "_ym_"]

  - provider_name: "Google Analytics"
    category: analytics
    country_hint: foreign
    legal_risk: high
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: true
    domains: ["google-analytics.com", "analytics.google.com", "googletagmanager.com/gtag", "gtag/js"]
    patterns: ["gtag(", "ga('create'", "GoogleAnalyticsObject", "_ga"]

  - provider_name: "Google Tag Manager"
    category: analytics
    country_hint: foreign
    legal_risk: high
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: true
    domains: ["googletagmanager.com", "gtm.js"]
    patterns: ["GTM-", "dataLayer"]

  - provider_name: "Meta Pixel (Facebook)"
    category: marketing
    country_hint: foreign
    legal_risk: high
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: true
    domains: ["connect.facebook.net", "facebook.com/tr"]
    patterns: ["fbq(", "_fbp", "_fbc"]

  - provider_name: "TikTok Pixel"
    category: marketing
    country_hint: foreign
    legal_risk: high
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: true
    domains: ["analytics.tiktok.com", "tiktok.com/i18n/pixel"]
    patterns: ["ttq.", "TiktokAnalyticsObject"]

  - provider_name: "VK Pixel / Top.Mail.ru"
    category: marketing
    country_hint: RU
    legal_risk: medium
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: false
    domains: ["vk.com/rtrg", "top-fwz1.mail.ru", "top.mail.ru"]
    patterns: ["_tmr", "VK.Retargeting", "vk_openapi"]

  - provider_name: "Hotjar"
    category: analytics
    country_hint: foreign
    legal_risk: high
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: true
    domains: ["hotjar.com", "static.hotjar.com", "script.hotjar.com"]
    patterns: ["hj(", "_hjSettings"]

  - provider_name: "FullStory"
    category: analytics
    country_hint: foreign
    legal_risk: high
    should_be_disclosed_in_policy: true
    should_trigger_cookie_check: true
    should_trigger_cross_border_check: true
    domains: ["fullstory.com", "fs.js"]
    patterns: ["FS.identify", "_fs_namespace"]

  - provider_name: "Cloudflare Insights"
    category: cdn
    country_hint: foreign
    legal_risk: medium
