# Известные аналитические/маркетинговые cookie-имена — для проверки
# «cookies до согласия» (Cookie_006). Сопоставляются по префиксу имени cookie.
tracking_cookie_names:
  - name: "_ym_uid"
    provider: "Яндекс.Метрика"
    category: analytics
  - name: "_ym_d"
    provider: "Яндекс.Метрика"
    category: analytics
  - name: "_ym_isad"
    provider: "Яндекс.Метрика"
    category: analytics
  - name: "_ga"
    provider: "Google Analytics"
    category: analytics
  - name: "_gid"
    provider: "Google Analytics"
    category: analytics
  - name: "_gcl_au"
    provider: "Google Ads"
    category: marketing
  - name: "_fbp"
    provider: "Meta Pixel"
    category: marketing
  - name: "_fbc"
    provider: "Meta Pixel"
    category: marketing
  - name: "_tt_enable_cookie"
    provider: "TikTok Pixel"
    category: marketing
  - name: "_ttp"
    provider: "TikTok Pixel"
    category: marketing
  - name: "roistat"
    provider: "Roistat"
    category: marketing
  - name: "_roistat"
    provider: "Roistat"
    category: marketing
  - name: "calltouch"
    provider: "Calltouch"
    category: marketing
  - name: "_ct_"
    provider: "Calltouch"
    category: marketing
  - name: "_hjSession"
    provider: "Hotjar"
    category: analytics
  - name: "_hjid"
    provider: "Hotjar"
    category: analytics
  - name: "mindbox"
    provider: "Mindbox"
    category: marketing
  - name: "tmr_"
    provider: "Top.Mail.ru / VK"
    category: marketing
  - name: "carrotquest"
    provider: "Carrot quest"
    category: marketing
