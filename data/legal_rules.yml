# Правила rule engine. Метаданные (текст, уровень, score, флаги) редактируются
# здесь БЕЗ изменения кода. Логика условия каждого правила реализована в
# legal/rule_engine.py как предикат с тем же id (поле `predicate`).
#
# Чтобы отключить правило — enabled: false.
# Чтобы изменить формулировку/вес — правьте title/report_phrase/score/risk_level.
# Чтобы добавить НОВОЕ правило — добавьте предикат в rule_engine.PREDICATES и
# элемент сюда с тем же id.
#
# ВАЖНО про тон: report_phrase формулируется как «признак риска», а не как
# установленное нарушение.

